<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>🍄 Mushroom Map</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header>
          <div class="title-row">
            <h1>🍄 Mushroom Map</h1>
            <button id="sidebar-hide" class="ghost small" title="Hide panel">‹‹</button>
          </div>
          <p class="sub" id="t-subtitle"></p>
        </header>

        <section class="panel">
          <div class="panel-head">
            <h2 id="t-filter"></h2>
            <button id="refresh" class="ghost small"></button>
          </div>
          <label for="filter-name" id="t-mushroom-name"></label>
          <div class="filter-row">
            <input id="filter-name" list="name-options" autocomplete="off" />
            <datalist id="name-options"></datalist>
            <button id="clear-filter" class="ghost" title="Clear">✕</button>
          </div>
          <p id="count" class="muted"></p>
        </section>

        <section class="panel" id="legend-panel" hidden>
          <h2 id="t-species"></h2>
          <ul id="legend" class="legend"></ul>
        </section>

        <section class="panel" id="list-panel">
          <h2 id="t-sightings"></h2>
          <ul id="sight-list" class="sight-list"></ul>
        </section>

        <section class="panel">
          <h2 id="t-add"></h2>
          <form id="add-form">
            <label for="f-name"><span id="t-name"></span> *</label>
            <input id="f-name" name="name" required />

            <label for="f-image" id="t-photo"></label>
            <input id="f-image" name="image" type="file" accept="image/*" />

            <div class="coords">
              <div>
                <label for="f-lat" id="t-lat"></label>
                <input id="f-lat" name="lat" inputmode="decimal" />
              </div>
              <div>
                <label for="f-lng" id="t-lng"></label>
                <input id="f-lng" name="lng" inputmode="decimal" />
              </div>
            </div>
            <p class="hint" id="t-coord-hint"></p>

            <label for="f-notes" id="t-notes"></label>
            <textarea id="f-notes" name="notes" rows="2"></textarea>

            <button type="submit" id="submit-btn"></button>
            <p id="form-msg" class="muted"></p>
          </form>
        </section>
      </aside>

      <main id="map"></main>

      <button id="sidebar-show" title="Show panel">››</button>

      <div id="map-controls">
        <div class="seg" role="group" aria-label="Language">
          <button id="lang-pl">PL</button>
          <button id="lang-en">EN</button>
        </div>
        <div class="seg" role="group" aria-label="Base map">
          <button id="base-dark"></button>
          <button id="base-sat"></button>
        </div>
        <div class="seg" role="group" aria-label="Legend layout">
          <button id="legend-vertical">▤</button>
          <button id="legend-horizontal">▬</button>
        </div>
        <button id="save-jpg"></button>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
